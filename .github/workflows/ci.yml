# Gate G2 (QA plan 4.1): runs on every push to a PR and on main. Cheapest checks first:
# fast-checks (format, lint, types, complexity, secrets, dependency audit; budget 2 minutes) must
# pass before the test jobs start (budget 10 minutes, M11). Every job named in
# .github/rulesets/main.json is a required status check, so a red job blocks the merge.
# Nothing here retries a failed step or test: a flaky test is quarantined the same day (M12).
# Coverage is printed to each job's summary for the monthly report. It never gates a merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1 (G2a): one job, steps ordered from cheapest to most expensive.
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the history of the branch
      - name: C++ format (clang-format)
        run: clang-format --dry-run --Werror cpp/include/greenhouse/*.hpp cpp/src/*.cpp cpp/tests/*.cpp
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - name: Python format (ruff format)
        run: ruff format --check .
      - name: Python lint (ruff)
        run: ruff check .
      - name: Python types (mypy)
        run: mypy
      - name: Complexity 10 or less and 60 lines or fewer per function, Python and C++ (lizard, M13)
        run: lizard -C 10 -L 60 -w cpp/include cpp/src backend/app
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 .
      # Dependency audits (M15). A PR that changes a lockfile cannot add a package with a known
      # advisory, so these steps block it. On any other PR or on main they report without
      # blocking: an advisory found later in a package we already use starts the M15 clock
      # (Critical 2 days, High 7 days), shows here and in the nightly run, and blocks a release
      # only past its deadline (QA plan 2.2).
      - name: Did this PR change dependencies?
        id: deps
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=false
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && git diff --name-only "origin/${BASE_REF}...HEAD" \
            | grep -qE '(requirements\.lock|package-lock\.json|package\.json)$'; then
            changed=true
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
      - name: Python dependency audit (pip-audit, M15)
        continue-on-error: ${{ steps.deps.outputs.changed != 'true' }}
        run: pip-audit -r backend/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: JavaScript format (Prettier)
        working-directory: frontend
        run: npm run format:check
      - name: JavaScript lint (ESLint)
        working-directory: frontend
        run: npm run lint
      - name: CSS lint (Stylelint)
        working-directory: frontend
        run: npm run lint:css
      - name: JavaScript dependency audit (npm audit, M15)
        continue-on-error: ${{ steps.deps.outputs.changed != 'true' }}
        run: |
          npm audit --prefix frontend --audit-level=high
          npm audit --prefix e2e --audit-level=high

  # Stage 2 (G2b): tests, in parallel, only after fast-checks passes.
  backend-tests:
    needs: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: greenhouse
          MYSQL_USER: greenhouse
          MYSQL_PASSWORD: ci_only_password
          MYSQL_ROOT_PASSWORD: ci_only_root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      APP_ENV: ci
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: greenhouse
      DB_USER: greenhouse
      DB_PASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff-cover compares with the base branch
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - name: Unit and integration tests (pytest)
        run: pytest
      - name: Coverage to the job summary (reported, not gated)
        if: always()
        run: |
          {
            echo "### Python coverage (reported only; QA plan 7.3)"
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Changed-line coverage to the job summary (reported, not gated)
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml --compare-branch="origin/${GITHUB_BASE_REF}" \
            --format markdown:diff-coverage.md
          {
            echo "### Changed-line coverage (reported only)"
            cat diff-coverage.md
          } >> "$GITHUB_STEP_SUMMARY"

  cpp:
    needs: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - name: Configure and build (CMake, coverage flags on)
        run: |
          cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Debug -DGREENHOUSE_COVERAGE=ON
          cmake --build build/cpp -j
      - name: Tests (GoogleTest)
        run: ctest --test-dir build/cpp --output-on-failure
      - name: Static analysis (clang-tidy, no warnings)
        run: clang-tidy -p build/cpp cpp/src/*.cpp
      - name: Coverage to the job summary (gcovr; reported, not gated)
        if: always()
        run: |
          gcovr --root . --object-directory build/cpp --filter cpp/src/ --filter cpp/include/ \
            --markdown-summary coverage-cpp.md build/cpp
          {
            echo "### C++ coverage (reported only; QA plan 7.3)"
            cat coverage-cpp.md
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-tests:
    needs: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests (Vitest)
        run: npm test
      - name: Coverage to the job summary (reported, not gated)
        if: always()
        run: |
          node -e '
            const total = require("./coverage/coverage-summary.json").total;
            console.log("### Front-end coverage (reported only; QA plan 7.3)");
            for (const kind of ["lines", "branches", "functions", "statements"]) {
              console.log(`- ${kind}: ${total[kind].pct}%`);
            }
          ' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  # The README quick start on a clean runner (QA plan 9.4), so the setup steps cannot silently
  # break. It does not replace the human dry run, which also tests installing the prerequisites.
  # Known gap, defect #2 (S3, P3, deferred until ADR 0001): make migrate, make seed and make run
  # are still stubs, so this job runs setup, db-up and test only (docs/DEBT.md).
  fresh-setup:
    needs: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: README quick start
        run: |
          cp .env.example .env
          make setup
          make db-up
          make test

  # Stage 3: browser flows with axe and Lighthouse (M14). Matthew turns this on by setting the
  # repository variable E2E_ENABLED=true once the first real page template exists
  # (docs/REPO_SETTINGS.md; docs/DEBT.md).
  e2e:
    needs: [backend-tests, cpp, frontend-tests]
    if: vars.E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --prefix frontend
      - run: npm ci --prefix e2e
      - run: npx --prefix e2e playwright install --with-deps chromium
      - name: Core flows with axe (Q2, M14)
        working-directory: e2e
        run: npx playwright test
      - name: Lighthouse accessibility 95 or more (M14)
        run: npm run lighthouse --prefix e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
