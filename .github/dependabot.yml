# Weekly dependency updates, merged or closed on Mondays by the build cop (docs/ROTATION.md; QA plan 6.3).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
    # ESLint stays on 9 until eslint-plugin-jsx-a11y supports 10 (docs/DEBT.md). CI failed the
    # first ESLint 10 update on October 23, 2026, which is the gate doing its job.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
