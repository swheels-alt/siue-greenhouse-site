# Weekly dependency updates, merged or closed on Mondays by the build cop (docs/ROTATION.md; QA plan 6.3).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
