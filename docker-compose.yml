# Local development stack (QA plan 6.2). Match the MySQL version to what SIUE ITS runs (D2).
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-greenhouse}
      MYSQL_USER: ${DB_USER:-greenhouse}
      MYSQL_PASSWORD: ${DB_PASSWORD:-greenhouse_dev_only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_only}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
